<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBFD" />
    <title>You’re offline — iKAN</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #FBFBFD; color: #151515;
        font: 15px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { font: 600 24px/1.25 Sora, system-ui, sans-serif; margin: 20px 0 8px; }
      p { margin: 0 auto; max-width: 30ch; color: #5b5b66; }
      button {
        margin-top: 24px; height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
        background: #151515; color: #fff; font: 600 15px/1 inherit; cursor: pointer;
      }
      .help { margin-top: 28px; font-size: 13px; }
      .help a { color: #8C1D18; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="iKAN" />
      <h1>You’re offline</h1>
      <p>Connect to the internet to open this page. Anything you saved on this phone is still here.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="help">Need help now? Call <a href="tel:18005990019">1800-599-0019</a></p>
    </main>
  </body>
</html>
