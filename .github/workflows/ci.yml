# Runs on every push and pull request. Three checks, in the order that fails fastest.
#
# Why this exists: the repo had no CI at all, and deploys go straight to production from main.
# A typecheck error reached the live site only because somebody noticed locally. These are the
# same commands run by hand during development, so nothing here is new - it is just no longer
# optional.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless; cancel it rather than pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: bunx eslint .

      # Every resource uses the same building blocks (headings, lists, charts, tables, sources,
      # pictures, links), so they all render through the same styles. See the script's header.
      - name: Resources follow the house rules
        run: bun scripts/check-resources.ts

      # The build also regenerates public/sitemap.xml, so a drift between the committed sitemap
      # and what the route data would produce shows up here rather than in production.
      - name: Build
        run: bun run build

      - name: Sitemap is committed and current
        run: |
          if ! git diff --quiet -- public/sitemap.xml; then
            echo "public/sitemap.xml is out of date. Run 'bun run sitemap' and commit the result."
            git --no-pager diff -- public/sitemap.xml
            exit 1
          fi
