# A nightly dump of the iKAN database, because the Supabase project is on the free plan and
# stays there. Free has no automatic backups and no point-in-time recovery: without this, the
# only copy of every journal entry, assessment and diary in the product is the live database.
#
# scripts/backup-db.sh already does this properly, but only when someone remembers to run it on
# their own machine. This is the same dump on a schedule that does not depend on anyone.
#
# Two secrets are needed (Settings -> Secrets and variables -> Actions):
#   IKAN_DB_URL         session-mode URI, port 5432, from Supabase -> Settings -> Database
#   BACKUP_PASSPHRASE   any long random string, kept in your password manager
#
# The dump is encrypted before it leaves the runner. This repository is private, so artifacts
# are already restricted to people who can read it - but a dump of this database is journals,
# assessment answers and health data, and "private repository" is a weaker promise than
# "unreadable without the passphrase". Losing the passphrase means losing the backups, so store
# it somewhere that is itself backed up.
#
# To restore:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in ikan-<date>.dump.enc -out ikan.dump -pass pass:...
#   pg_restore --clean --if-exists --no-owner -d "$IKAN_DB_URL" ikan.dump
#
# Two things to know about scheduled workflows: GitHub delays them under load, so the time is
# approximate, and it disables them after 60 days with no repository activity. If this repo goes
# quiet, the backups stop quietly with it - check the Actions tab before relying on them.

name: Backup

on:
  schedule:
    - cron: "45 19 * * *" # 01:15 IST daily
  workflow_dispatch: # and on demand, for a backup before anything risky

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      # The database is Postgres 17; pg_dump refuses to dump a server newer than itself, and
      # the runner image ships an older client. This installs a matching one from PGDG.
      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Dump, verify and encrypt
        env:
          IKAN_DB_URL: ${{ secrets.IKAN_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$IKAN_DB_URL" || { echo "::error::IKAN_DB_URL is not set"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::BACKUP_PASSPHRASE is not set"; exit 1; }
          case "$IKAN_DB_URL" in
            *:6543/*) echo "::error::That is the transaction pooler. Use session mode, port 5432."; exit 1 ;;
          esac

          name="ikan-$(date -u +%Y%m%d-%H%M%S)"
          pg_dump --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth "$IKAN_DB_URL" --file="$name.dump"

          # An unreadable dump is not a backup. Prove it lists before shipping it, and fail the
          # run if it looks too thin - a silent empty backup is worse than a loud failure.
          tables=$(pg_restore --list "$name.dump" | grep -c 'TABLE DATA')
          echo "$tables tables with data, $(du -h "$name.dump" | cut -f1)"
          [ "$tables" -ge 3 ] || { echo "::error::only $tables tables in the dump"; exit 1; }

          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$name.dump" -out "$name.dump.enc" -pass env:BACKUP_PASSPHRASE
          rm -f "$name.dump"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.dump.enc
          retention-days: 90
          if-no-files-found: error
